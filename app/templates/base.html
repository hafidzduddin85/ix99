<!DOCTYPE html>
<html lang="id" x-data="{ dark: localStorage.getItem('dark') === 'true' }" :class="{ 'dark': dark }">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}IX99 Stock Analyst{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: '#0ea5e9' }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

  <nav class="bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" class="font-bold text-lg tracking-tight text-sky-500">IX99</a>
      <div class="flex items-center gap-3">
        <a href="/" class="text-sm text-gray-600 dark:text-gray-400 hover:text-sky-500 transition-colors">Dashboard</a>

        <!-- Pipeline Controls -->
        <div x-data="pipelineControls()" class="flex items-center gap-2">

          <!-- Run Daily Update -->
          <button
            @click="runPipeline()"
            :disabled="loading"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-sky-500 hover:bg-sky-600 disabled:opacity-50 disabled:cursor-not-allowed text-white transition-colors"
          >
            <span x-show="!loading">▶ Update Harian</span>
            <span x-show="loading">⏳ Running...</span>
          </button>

          <!-- Fill Opening -->
          <button
            @click="runFillOpening()"
            :disabled="loading"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-violet-500 hover:bg-violet-600 disabled:opacity-50 disabled:cursor-not-allowed text-white transition-colors"
          >
            <span x-show="!loading">📂 Fill Opening</span>
            <span x-show="loading">⏳ Running...</span>
          </button>

          <!-- Fill Broker Daily -->
          <button
            @click="runFillBrokerDaily()"
            :disabled="loading"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-amber-500 hover:bg-amber-600 disabled:opacity-50 disabled:cursor-not-allowed text-white transition-colors"
          >
            <span x-show="!loading">📊 Fill Broker Daily</span>
            <span x-show="loading">⏳ Running...</span>
          </button>

          <!-- Manage Stocks -->
          <button
            @click="$store.stockModal.open = true"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-500 hover:bg-emerald-600 text-white transition-colors"
          >
            ⚙ Kelola Saham
          </button>

          <!-- Status Toast -->
          <div
            x-show="toast"
            x-transition
            x-text="toast"
            class="text-xs px-3 py-1.5 rounded-lg"
            :class="toastOk ? 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300' : 'bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300'"
          ></div>
        </div>

        <!-- Stock Management Modal -->
        <div
          x-data="stockManager()"
          x-show="$store.stockModal.open"
          x-cloak
          class="fixed inset-0 z-50 flex items-center justify-center bg-black/50"
          @keydown.escape.window="$store.stockModal.open = false"
        >
          <div class="bg-white dark:bg-gray-900 rounded-xl shadow-2xl w-full max-w-md mx-4 p-6">
            <div class="flex items-center justify-between mb-4">
              <h2 class="font-semibold text-base">Kelola Saham</h2>
              <button @click="$store.stockModal.open = false" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xl leading-none">&times;</button>
            </div>

            <!-- Add Stock -->
            <div class="mb-5">
              <p class="text-xs text-gray-500 dark:text-gray-400 mb-2">Tambah saham baru ke tabel stocks</p>
              <div class="flex gap-2">
                <input
                  x-model="newTicker"
                  @keydown.enter="addStock()"
                  placeholder="Ticker (e.g. BBCA)"
                  class="flex-1 px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-emerald-400"
                  :disabled="busy"
                />
                <button
                  @click="addStock()"
                  :disabled="busy || !newTicker.trim()"
                  class="px-4 py-2 text-sm rounded-lg bg-emerald-500 hover:bg-emerald-600 disabled:opacity-50 text-white font-medium transition-colors"
                >Tambah</button>
              </div>
            </div>

            <!-- Delete Stock -->
            <div class="mb-5">
              <p class="text-xs text-gray-500 dark:text-gray-400 mb-2">Nonaktifkan saham (set is_active = false)</p>
              <div class="flex gap-2">
                <input
                  x-model="delTicker"
                  @keydown.enter="deleteStock()"
                  placeholder="Ticker (e.g. ADHI)"
                  class="flex-1 px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-red-400"
                  :disabled="busy"
                />
                <button
                  @click="deleteStock()"
                  :disabled="busy || !delTicker.trim()"
                  class="px-4 py-2 text-sm rounded-lg bg-red-500 hover:bg-red-600 disabled:opacity-50 text-white font-medium transition-colors"
                >Nonaktifkan</button>
              </div>
            </div>

            <!-- Feedback -->
            <div
              x-show="msg"
              x-text="msg"
              class="text-sm px-3 py-2 rounded-lg"
              :class="msgOk ? 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300' : 'bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300'"
            ></div>
          </div>
        </div>

        <button
          @click="dark = !dark; localStorage.setItem('dark', dark)"
          class="p-2 rounded-lg bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"
        >
          <span x-show="!dark">🌙</span>
          <span x-show="dark">☀️</span>
        </button>
      </div>

      <script>
        function pipelineControls() {
          return {
            loading: false,
            toast: '',
            toastOk: true,
            async _call(url) {
              this.loading = true
              this.toast = ''
              try {
                const secret = document.cookie.split(';').find(c => c.trim().startsWith('pipeline_secret='))?.split('=')[1] ?? ''
                const res = await fetch(url, {
                  method: 'POST',
                  headers: secret ? { 'x-api-key': secret } : {}
                })
                const data = await res.json()
                if (res.ok) {
                  this.toastOk = true
                  this.toast = `✓ Selesai — success: ${data.success ?? data.upserted ?? '?'}`
                } else {
                  this.toastOk = false
                  this.toast = `✗ Error: ${data.detail ?? 'Unknown'}`
                }
              } catch (e) {
                this.toastOk = false
                this.toast = `✗ ${e.message}`
              } finally {
                this.loading = false
                setTimeout(() => this.toast = '', 5000)
              }
            },
            runPipeline() { this._call('/api/pipeline/run') },
            runFillOpening() { this._call('/api/pipeline/fill-opening') },
            runFillBrokerDaily() { this._call('/api/pipeline/fill-broker-daily') },
          }
        }

        document.addEventListener('alpine:init', () => {
          Alpine.store('stockModal', { open: false })
        })

        function stockManager() {
          return {
            newTicker: '',
            delTicker: '',
            busy: false,
            msg: '',
            msgOk: true,
            _feedback(ok, text) {
              this.msgOk = ok
              this.msg = text
              setTimeout(() => this.msg = '', 4000)
            },
            async addStock() {
              const ticker = this.newTicker.trim().toUpperCase()
              if (!ticker) return
              this.busy = true
              try {
                const res = await fetch(`/api/stocks`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ ticker })
                })
                const data = await res.json()
                if (res.ok) {
                  this._feedback(true, `✓ ${ticker} berhasil ditambahkan`)
                  this.newTicker = ''
                } else {
                  this._feedback(false, `✗ ${data.detail ?? 'Gagal'}`)
                }
              } catch (e) {
                this._feedback(false, `✗ ${e.message}`)
              } finally {
                this.busy = false
              }
            },
            async deleteStock() {
              const ticker = this.delTicker.trim().toUpperCase()
              if (!ticker) return
              this.busy = true
              try {
                const res = await fetch(`/api/stocks/${ticker}`, { method: 'DELETE' })
                const data = await res.json()
                if (res.ok) {
                  this._feedback(true, `✓ ${ticker} dinonaktifkan`)
                  this.delTicker = ''
                } else {
                  this._feedback(false, `✗ ${data.detail ?? 'Gagal'}`)
                }
              } catch (e) {
                this._feedback(false, `✗ ${e.message}`)
              } finally {
                this.busy = false
              }
            },
          }
        }
      </script>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
