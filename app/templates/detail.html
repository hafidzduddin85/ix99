{% extends "base.html" %}
{% block title %}{{ ticker }} — IX99{% endblock %}

{% block content %}
<div x-data="stockDetail('{{ ticker }}')" x-init="init()">

  <!-- Back -->
  <a href="/" class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-sky-500 mb-4 transition-colors">
    ← Kembali
  </a>

  <!-- Header -->
  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-5 mb-4">
    <template x-if="loading">
      <div class="text-gray-400">Memuat...</div>
    </template>
    <template x-if="!loading && data">
      <div>
        <div class="flex flex-wrap items-start justify-between gap-3">
          <div>
            <h1 class="text-2xl font-bold text-sky-500" x-text="data.ticker"></h1>
            <div class="text-gray-500 text-sm" x-text="data.company_name"></div>
            <div class="text-xs text-gray-400 mt-1" x-text="(data.sector ?? '') + (data.subsector ? ' · ' + data.subsector : '')"></div>
          </div>
          <div class="text-right">
            <div class="text-3xl font-bold font-mono" x-text="fmt(data.close)"></div>
            <div class="mt-1">
              <span class="badge" :class="trendClass(data.trend_direction)" x-text="data.trend_direction ?? '-'"></span>
            </div>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Indicators Grid -->
  <template x-if="!loading && data">
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 mb-4">
      <div class="card">
        <div class="card-label">Trend Score</div>
        <div class="card-value" x-text="data.trend_score ?? '-'"></div>
      </div>
      <div class="card">
        <div class="card-label">ADX14</div>
        <div class="card-value" x-text="fmtDec(data.adx14)"></div>
      </div>
      <div class="card">
        <div class="card-label">RSI14</div>
        <div class="card-value" x-text="fmtDec(data.rsi14)"></div>
      </div>
      <div class="card">
        <div class="card-label">ATR14</div>
        <div class="card-value" x-text="fmtDec(data.atr14)"></div>
      </div>
      <div class="card">
        <div class="card-label">EMA20</div>
        <div class="card-value" x-text="fmt(data.ema20)"></div>
      </div>
      <div class="card">
        <div class="card-label">EMA50</div>
        <div class="card-value" x-text="fmt(data.ema50)"></div>
      </div>
      <div class="card">
        <div class="card-label">EMA200</div>
        <div class="card-value" x-text="fmt(data.ema200)"></div>
      </div>
      <div class="card">
        <div class="card-label">Vol Ratio</div>
        <div class="card-value" x-text="fmtDec(data.volume_ratio)"></div>
      </div>
      <div class="card">
        <div class="card-label">+DI / -DI</div>
        <div class="card-value text-base" x-text="fmtDec(data.plus_di) + ' / ' + fmtDec(data.minus_di)"></div>
      </div>
      <div class="card">
        <div class="card-label">Struktur</div>
        <div class="card-value text-base flex gap-2 flex-wrap">
          <span x-show="data.higher_high" class="text-green-500 text-sm">HH</span>
          <span x-show="data.higher_low" class="text-green-500 text-sm">HL</span>
          <span x-show="data.lower_high" class="text-red-500 text-sm">LH</span>
          <span x-show="data.lower_low" class="text-red-500 text-sm">LL</span>
        </div>
      </div>
      <div class="card col-span-2">
        <div class="card-label">Entry Signal</div>
        <div class="card-value">
          <span x-show="data.entry_signal" class="text-green-500">✓ Terpenuhi</span>
          <span x-show="!data.entry_signal" class="text-gray-400">Belum terpenuhi</span>
        </div>
      </div>
    </div>
  </template>

  <!-- Chart -->
  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-4 mb-4">
    <div class="text-sm font-medium mb-3 text-gray-600 dark:text-gray-400">Harga & EMA</div>
    <canvas id="priceChart" height="120"></canvas>
  </div>

  <!-- Volume Chart -->
  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-4 mb-4">
    <div class="text-sm font-medium mb-3 text-gray-600 dark:text-gray-400">Volume</div>
    <canvas id="volumeChart" height="60"></canvas>
  </div>

  <!-- Broker Flow -->
  <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-4">
    <div class="text-sm font-medium mb-3 text-gray-600 dark:text-gray-400">Broker Flow (30 hari)</div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <!-- Net Buying -->
      <div>
        <div class="text-xs font-semibold text-green-600 dark:text-green-400 mb-2">Top Net Buying</div>
        <div class="space-y-1">
          <template x-for="b in broker.top_net_buying" :key="b.broker_code">
            <div class="flex justify-between text-sm py-1 border-b border-gray-100 dark:border-gray-800">
              <span class="font-medium" x-text="b.broker_code"></span>
              <span class="text-green-600 dark:text-green-400 font-mono" x-text="fmtLot(b.net_lot)"></span>
            </div>
          </template>
          <template x-if="broker.top_net_buying?.length === 0">
            <div class="text-gray-400 text-xs">Tidak ada data</div>
          </template>
        </div>
      </div>

      <!-- Net Selling -->
      <div>
        <div class="text-xs font-semibold text-red-500 mb-2">Top Net Selling</div>
        <div class="space-y-1">
          <template x-for="b in broker.top_net_selling" :key="b.broker_code">
            <div class="flex justify-between text-sm py-1 border-b border-gray-100 dark:border-gray-800">
              <span class="font-medium" x-text="b.broker_code"></span>
              <span class="text-red-500 font-mono" x-text="fmtLot(b.net_lot)"></span>
            </div>
          </template>
          <template x-if="broker.top_net_selling?.length === 0">
            <div class="text-gray-400 text-xs">Tidak ada data</div>
          </template>
        </div>
      </div>

    </div>
  </div>

</div>

<style>
  .card { @apply bg-gray-50 dark:bg-gray-800 rounded-xl p-4 border border-gray-100 dark:border-gray-700; }
  .card-label { @apply text-xs text-gray-500 dark:text-gray-400 mb-1; }
  .card-value { @apply text-xl font-bold; }
  .badge { @apply inline-block px-2 py-0.5 rounded-full text-xs font-medium; }
</style>

<script src="/static/js/detail.js"></script>
{% endblock %}
